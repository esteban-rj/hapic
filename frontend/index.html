<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("hapic-theme"); } catch {}
        const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#141416" : "#fafafa";
      })();
    </script>
    <title>Hapic · Tu equipo, ampliado</title>
    <meta
      name="description"
      content="Organiza proyectos y trabaja con agentes persistentes en tu propio entorno."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
